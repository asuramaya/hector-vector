<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hector-vector</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="application-name" content="hector-vector" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app editor">
      <header class="topbar editor-bar">
        <div class="doc-actions panel-actions">
          <div class="menu" data-menu="doc-new">
            <button class="ghost-button menu-trigger" type="button" aria-haspopup="true" aria-expanded="false">New ▾</button>
            <div class="menu-list" role="menu" hidden></div>
          </div>
          <button id="process-button" class="ghost-button" type="button" title="Process & batch images into vectors (gallery + jobs)">Process<span id="process-count" class="menu-count"></span>…</button>
          <button id="open-button" class="ghost-button" type="button" title="Open a vector from outputs">Open</button>
          <button id="save-button" class="ghost-button" type="button" title="Save the canvas as .svg">Save</button>
          <div class="menu" data-menu="doc-export">
            <button class="ghost-button menu-trigger" type="button" aria-haspopup="true" aria-expanded="false">Export ▾</button>
            <div class="menu-list" role="menu" hidden></div>
          </div>
          <button id="install-button" class="ghost-button" type="button" hidden title="Install as a desktop app (borderless window)">⤓ Install</button>
        </div>
        <div class="panel-actions doc-actions-right">
          <button id="undo-button" class="ghost-button" type="button" title="Undo (Ctrl/Cmd+Z)" disabled>↶ Undo</button>
          <button id="redo-button" class="ghost-button" type="button" title="Redo (Ctrl/Cmd+Shift+Z)" disabled>↷ Redo</button>
          <button id="rail-toggle" class="ghost-button" type="button" title="Collapse the side panel">⊟</button>
        </div>
        <!-- App-window titlebar controls — shown only when launched as a standalone
             window (see launch.sh); driven by AWC / window.close in app.js. -->
        <div class="window-controls" id="window-controls" hidden>
          <button id="win-min" class="win-button" type="button" title="Minimize" aria-label="Minimize">─</button>
          <button id="win-max" class="win-button" type="button" title="Maximize" aria-label="Maximize">▢</button>
          <button id="win-close" class="win-button win-close" type="button" title="Close" aria-label="Close">✕</button>
        </div>
      </header>

      <section class="editor-grid">
        <nav class="toolstrip" role="toolbar" aria-label="Tools">
          <button class="tool-button active" data-tool="select" type="button" title="Select / Move (V)">▣</button>
          <button class="tool-button" data-tool="node" type="button" title="Edit points (A)">✥</button>
          <span class="tool-sep" aria-hidden="true"></span>
          <button class="tool-button" data-tool="pen" type="button" title="Pen — click to add points (P)">✎</button>
          <button class="tool-button" data-tool="rect" type="button" title="Rectangle (R)">▭</button>
          <button class="tool-button" data-tool="ellipse" type="button" title="Ellipse (E)">◯</button>
          <button class="tool-button" data-tool="line" type="button" title="Line (L)">╱</button>
        </nav>

        <article class="stage-wrap preview-panel">
          <div class="stage-head panel-head">
            <span id="output-label">Canvas</span>
            <div id="output-picker" class="output-picker" hidden></div>
          </div>
          <!-- hidden, kept for code compatibility with the two-pane plumbing -->
          <div id="input-preview" class="preview-frame" hidden></div>
          <div id="output-preview" class="preview-frame empty-frame">Import or open a vector to start.</div>
          <div class="panel-foot">
            <div class="panel-actions viewport-controls">
              <button class="ghost-button" data-vp="output" data-action="zoom-out" type="button" title="Zoom out (-)">-</button>
              <button class="ghost-button" data-vp="output" data-action="fit" type="button" title="Fit (f)">Fit</button>
              <button class="ghost-button" data-vp="output" data-action="actual" type="button" title="Actual size (0)">1:1</button>
              <button class="ghost-button" data-vp="output" data-action="zoom-in" type="button" title="Zoom in (+)">+</button>
              <button class="ghost-button" data-vp="output" data-action="bg" type="button" title="Cycle background (b)">BG</button>
              <span class="bar-sep"></span>
              <button class="ghost-button" data-xform="rotateCCW" type="button" title="Rotate 90° left (selection, or whole artboard)">↺</button>
              <button class="ghost-button" data-xform="rotateCW" type="button" title="Rotate 90° right (selection, or whole artboard)">↻</button>
              <button class="ghost-button" data-xform="flipH" type="button" title="Flip horizontal (selection, or whole artboard)">⇄</button>
              <button class="ghost-button" data-xform="flipV" type="button" title="Flip vertical (selection, or whole artboard)">⇅</button>
            </div>
          </div>
        </article>

        <aside class="rightdock" id="rightdock">
          <div class="inspector" id="inspector">
            <div class="panel-head"><span id="inspector-title">Nothing selected</span></div>
            <div id="inspector-body" class="inspector-body"></div>
          </div>
          <div class="rail-section layers" data-section="layers">
            <div class="panel-head section-head">
              <span class="caret">▾</span><span class="sec-label">Layers</span>
              <div class="panel-actions">
                <div class="menu" data-menu="layers">
                  <button class="ghost-button menu-trigger" type="button" aria-haspopup="true" aria-expanded="false" title="Layer actions">⋯</button>
                  <div class="menu-list" role="menu" hidden></div>
                </div>
              </div>
            </div>
            <div id="layers-list" class="layers-list section-body"></div>
          </div>
        </aside>
      </section>

      <!-- Import/library plumbing — kept in the DOM (hidden) so the job-queue and
           library code keeps its element bindings; the UI now lives in header menus
           (Import ▾ / Library ▾) and on-demand modals. -->
      <div id="workspace-plumbing" hidden>
        <span id="workspace-title"></span>
        <span id="workspace-path"></span>
        <div class="source-row">
          <span id="source-path"></span>
          <button id="source-edit" type="button">Change</button>
          <button id="source-reset" type="button" hidden>Default</button>
        </div>
        <select id="process-select">
          <option value="upscale">Upscale PNG</option>
          <option value="cutout">Cutout PNG</option>
          <option value="chromakey">Greenscreen Cutout</option>
          <option value="vectorize">SVG Trace</option>
          <option value="pixelvec">Pixel Art → SVG</option>
          <option value="pipeline" selected>Production SVG</option>
        </select>
        <select id="mode-select">
          <option value="batch">Batch</option>
          <option value="single" selected>Single</option>
        </select>
        <label><input id="force-input" type="checkbox" /> Force</label>
        <button id="settings-button" type="button">Settings</button>
        <button id="run-button" type="button">Run</button>
        <div id="queue"></div>
        <button id="dropzone" type="button">Add Images<input id="file-input" type="file" accept="image/*" multiple hidden /></button>
      </div>

      <footer class="status-bar">
        <div id="status-text">Ready.</div>
        <div id="status-progress" class="status-progress" hidden>
          <div class="status-progress-track"><div id="status-progress-bar" class="status-progress-bar"></div></div>
          <span id="status-progress-label" class="status-progress-label"></span>
        </div>
      </footer>
    </main>

    <div id="modal-root" class="modal-root" hidden>
      <div class="modal-backdrop" data-modal-close></div>
      <div class="modal-window">
        <header class="panel-head">
          <span id="modal-title">Browse</span>
          <div class="panel-actions">
            <input id="modal-search" class="modal-search" type="search" placeholder="Filter…" hidden />
            <button class="ghost-button" type="button" data-modal-close>Close</button>
          </div>
        </header>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <div id="shortcut-hint" class="shortcut-hint" title="Keyboard shortcuts">
      <button id="shortcut-button" class="ghost-button" type="button">?</button>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
