<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hector-vector</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="topbar-info">
          <div class="label">IMAGE WORKSPACE</div>
          <h1 id="workspace-title">Workspace</h1>
          <div class="source-row">
            <span class="label source-label">SOURCE</span>
            <span id="source-path" class="workspace-path" title="Click to change"></span>
            <button id="source-edit" class="ghost-button" type="button">Change</button>
            <button id="source-reset" class="ghost-button" type="button" hidden>Default</button>
          </div>
          <div id="workspace-path" class="workspace-path"></div>
        </div>
        <button id="dropzone" class="drop-button" type="button">
          Add Images
          <input id="file-input" type="file" accept="image/*" multiple hidden />
        </button>
      </header>

      <section class="control-bar">
        <select id="process-select" title="Process (shortcut: [ / ])">
          <option value="upscale">Upscale PNG</option>
          <option value="cutout">Cutout PNG</option>
          <option value="chromakey">Greenscreen Cutout</option>
          <option value="vectorize">SVG Trace</option>
          <option value="pixelvec">Pixel Art → SVG</option>
          <option value="pipeline" selected>Production SVG</option>
        </select>
        <select id="mode-select" title="Batch processes the whole library; Single processes only the selected image">
          <option value="batch" selected>Batch</option>
          <option value="single">Single</option>
        </select>
        <label id="force-toggle" class="force-toggle" title="Re-run even on inputs that already have output for this process">
          <input id="force-input" type="checkbox" /> Force
        </label>
        <button id="settings-button" class="ghost-button" type="button" title="Process parameters (shortcut: ,)">Settings</button>
        <button id="run-button" type="button" title="Run (shortcut: Enter)">Run</button>
      </section>

      <section class="main-grid">
        <aside class="library">
          <div class="panel-head">
            <span>Library</span>
            <div class="panel-actions">
              <button id="browse-button" class="ghost-button" type="button">Browse</button>
              <button id="clean-derivatives" class="ghost-button" type="button" title="Delete .cutout/.mask/.preview files from source">Clean</button>
              <button id="remove-selected" class="ghost-button" type="button">Remove</button>
            </div>
          </div>
          <div id="queue" class="queue"></div>
        </aside>

        <article class="panel preview-panel">
          <div class="panel-head">
            <span>Input</span>
            <div class="panel-actions">
              <button id="info-button" class="ghost-button" type="button" title="Image info & rotate (i)">Info</button>
              <button id="copy-input-path" class="ghost-button" type="button" title="Copy absolute file path">Copy Path</button>
              <button id="copy-input-folder" class="ghost-button" type="button" title="Copy containing folder path">Folder</button>
              <button id="reveal-input" class="ghost-button" type="button" title="Open containing folder in file manager">Reveal</button>
              <a id="open-input" class="ghost-link" href="#" target="_blank" rel="noreferrer">Open</a>
            </div>
          </div>
          <div id="input-preview" class="preview-frame empty-frame">No image selected.</div>
          <div class="panel-foot">
            <div class="panel-actions viewport-controls">
              <button class="ghost-button" data-vp="input" data-action="zoom-out" type="button" title="Zoom out (-)">-</button>
              <button class="ghost-button" data-vp="input" data-action="fit" type="button" title="Fit (f)">Fit</button>
              <button class="ghost-button" data-vp="input" data-action="actual" type="button" title="Actual size (0)">1:1</button>
              <button class="ghost-button" data-vp="input" data-action="zoom-in" type="button" title="Zoom in (+)">+</button>
              <button class="ghost-button" data-vp="input" data-action="bg" type="button" title="Cycle background (b)">BG</button>
            </div>
          </div>
        </article>

        <article class="panel preview-panel output-panel">
          <div class="panel-head">
            <span id="output-label">Output</span>
            <div class="panel-actions">
              <button id="copy-svg-source" class="ghost-button" type="button" hidden title="Copy SVG markup to clipboard">Copy SVG</button>
              <button id="export-png" class="ghost-button" type="button" hidden title="Rasterize this SVG to a PNG at a chosen size">Export PNG</button>
              <button id="copy-output-path" class="ghost-button" type="button" title="Copy absolute file path">Copy Path</button>
              <button id="copy-output-folder" class="ghost-button" type="button" title="Copy containing folder path">Folder</button>
              <button id="reveal-output" class="ghost-button" type="button" title="Open containing folder in file manager">Reveal</button>
              <a id="open-output" class="ghost-link" href="#" target="_blank" rel="noreferrer">Open</a>
            </div>
          </div>
          <div id="output-picker" class="output-picker" hidden></div>
          <div id="output-preview" class="preview-frame empty-frame">Run a process to render output.</div>
          <div class="panel-foot">
            <div class="panel-actions viewport-controls">
              <button class="ghost-button" data-vp="output" data-action="zoom-out" type="button" title="Zoom out (-)">-</button>
              <button class="ghost-button" data-vp="output" data-action="fit" type="button" title="Fit (f)">Fit</button>
              <button class="ghost-button" data-vp="output" data-action="actual" type="button" title="Actual size (0)">1:1</button>
              <button class="ghost-button" data-vp="output" data-action="zoom-in" type="button" title="Zoom in (+)">+</button>
              <button class="ghost-button" data-vp="output" data-action="bg" type="button" title="Cycle background (b)">BG</button>
            </div>
          </div>
        </article>
      </section>

      <footer class="status-bar">
        <div id="status-text">Ready.</div>
        <div class="panel-actions">
          <button id="jobs-button" class="ghost-button" type="button" title="Show job queue (shortcut: q)">
            Jobs <span id="jobs-count" class="badge" hidden></span>
          </button>
          <button id="clear-jobs" class="ghost-button" type="button" title="Remove finished, failed, and cancelled jobs">Clear Jobs</button>
        </div>
      </footer>
    </main>

    <div id="modal-root" class="modal-root" hidden>
      <div class="modal-backdrop" data-modal-close></div>
      <div class="modal-window">
        <header class="panel-head">
          <span id="modal-title">Browse</span>
          <div class="panel-actions">
            <input id="modal-search" class="modal-search" type="search" placeholder="Filter…" hidden />
            <button class="ghost-button" type="button" data-modal-close>Close</button>
          </div>
        </header>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <div id="shortcut-hint" class="shortcut-hint" title="Keyboard shortcuts">
      <button id="shortcut-button" class="ghost-button" type="button">?</button>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
