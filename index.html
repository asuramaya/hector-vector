<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hector-vector</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="application-name" content="hector-vector" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app editor">
      <header class="topbar editor-bar">
        <div class="panel-actions doc-actions-left">
          <div class="menu" data-menu="file">
            <button class="ghost-button menu-trigger" type="button" aria-haspopup="true" aria-expanded="false" title="New / Open / Save / Export">File ▾</button>
            <div class="menu-list" role="menu" hidden></div>
          </div>
        </div>
        <div class="panel-actions doc-actions-center">
          <button id="process-button" class="ghost-button" type="button" title="Process & batch images into vectors (gallery + jobs)">Process<span id="process-count" class="menu-count"></span>…</button>
        </div>
        <div class="panel-actions doc-actions-right">
          <button id="undo-button" class="ghost-button" type="button" title="Undo (Ctrl/Cmd+Z)" disabled>↶ Undo</button>
          <button id="redo-button" class="ghost-button" type="button" title="Redo (Ctrl/Cmd+Shift+Z)" disabled>↷ Redo</button>
          <button id="rail-toggle" class="ghost-button" type="button" title="Collapse the side panel">⊟</button>
        </div>
      </header>

      <section class="editor-grid">
        <nav class="toolstrip" role="toolbar" aria-label="Tools">
          <button class="tool-button tool-primary active" data-tool="select" data-key="V" type="button" title="Select / Move (V) — drag empty space to marquee (Alt = lasso) · Ctrl+T scale · Ctrl+R rotate">▣</button>
          <button class="tool-button tool-primary" data-tool="node" data-key="A" type="button" title="Edit points (A) — anchors &amp; handles">✥</button>
          <span class="tool-sep" aria-hidden="true"></span>
          <button class="tool-button" data-tool="pen" data-key="P" type="button" title="Pen — click to add points (P)">✎</button>
          <button class="tool-button" data-tool="curvature" data-key="C" type="button" title="Curvature — click to drop auto-smooth points (C)">⌒</button>
          <button class="tool-button" data-tool="rect" data-key="R" type="button" title="Rectangle (R)">▭</button>
          <button class="tool-button" data-tool="ellipse" data-key="E" type="button" title="Ellipse (E)">◯</button>
          <button class="tool-button" data-tool="line" data-key="L" type="button" title="Line (L)">╱</button>
          <span class="tool-spacer" aria-hidden="true"></span>
          <!-- Fill (primary) / stroke (secondary) swatches: reflect the selection or
               the default for new shapes; click to recolour. Rotate/flip moved to the
               right-click menu. -->
          <div class="tool-swatches" id="tool-swatches">
            <button class="swatch swatch-fill" id="swatch-fill" type="button" title="Fill — click to set the fill colour"></button>
            <button class="swatch swatch-stroke" id="swatch-stroke" type="button" title="Stroke — click to set the stroke colour"></button>
            <button class="swatch-swap" id="swatch-swap" data-key="⇧X" type="button" title="Swap fill / stroke (Shift+X)">⇄</button>
            <input type="color" id="swatch-color-input" hidden />
          </div>
        </nav>

        <article class="stage-wrap preview-panel" data-tool="select">
          <div class="stage-head panel-head">
            <span id="output-label">Canvas</span>
          </div>
          <div id="output-preview" class="preview-frame empty-frame">Import or open a vector to start.</div>
          <div class="panel-foot">
            <!-- Navigation only: object controls live on the left toolstrip. -->
            <div class="panel-actions viewport-controls">
              <button class="vp-btn" data-vp="output" data-action="zoom-out" data-key="−" type="button" title="Zoom out (-)">−</button>
              <button class="vp-btn" data-vp="output" data-action="fit" data-key="F" type="button" title="Fit (f)">Fit</button>
              <button class="vp-btn" data-vp="output" data-action="actual" data-key="0" type="button" title="Actual size (0)">1:1</button>
              <button class="vp-btn" data-vp="output" data-action="zoom-in" data-key="+" type="button" title="Zoom in (+)">+</button>
              <button class="vp-btn" data-vp="output" data-action="bg" data-key="B" type="button" title="Cycle background (b)">BG</button>
            </div>
          </div>
        </article>

        <aside class="rightdock" id="rightdock">
          <div class="dock-resizer" id="dock-resizer" title="Drag to resize"></div>
          <div class="rail-section history" data-section="history">
            <div class="panel-head section-head">
              <span class="caret">▾</span><span class="sec-label">History</span>
            </div>
            <div id="history-list" class="history-list section-body"></div>
          </div>
          <div class="dock-vresizer" id="dock-vresizer" title="Drag to resize History / Layers"></div>
          <div class="rail-section layers" data-section="layers">
            <div class="panel-head section-head">
              <span class="caret">▾</span><span class="sec-label">Layers</span>
              <div class="panel-actions">
                <div class="menu" data-menu="layers">
                  <button class="ghost-button menu-trigger" type="button" aria-haspopup="true" aria-expanded="false" title="Layer actions">⋯</button>
                  <div class="menu-list" role="menu" hidden></div>
                </div>
              </div>
            </div>
            <div id="layers-list" class="layers-list section-body"></div>
          </div>
        </aside>
      </section>

      <!-- Import/library plumbing — kept in the DOM (hidden) so the job-queue and
           library code keeps its element bindings; the UI now lives in header menus
           (Import ▾ / Library ▾) and on-demand modals. -->
      <div id="workspace-plumbing" hidden>
        <span id="workspace-title"></span>
        <span id="workspace-path"></span>
        <div class="source-row">
          <span id="source-path"></span>
          <button id="source-edit" type="button">Change</button>
          <button id="source-reset" type="button" hidden>Default</button>
        </div>
        <select id="process-select">
          <option value="upscale">Upscale PNG</option>
          <option value="cutout">Cutout PNG</option>
          <option value="chromakey">Greenscreen Cutout</option>
          <option value="vectorize">SVG Trace</option>
          <option value="pixelvec">Pixel Art → SVG</option>
          <option value="pipeline" selected>Production SVG</option>
        </select>
        <select id="mode-select">
          <option value="batch">Batch</option>
          <option value="single" selected>Single</option>
        </select>
        <label><input id="force-input" type="checkbox" /> Force</label>
        <button id="settings-button" type="button">Settings</button>
        <button id="run-button" type="button">Run</button>
        <div id="queue"></div>
        <button id="dropzone" type="button">Add Images<input id="file-input" type="file" accept="image/*" multiple hidden /></button>
      </div>

      <footer class="status-bar">
        <div id="status-text">Ready.</div>
        <div id="status-progress" class="status-progress" hidden>
          <div class="status-progress-track"><div id="status-progress-bar" class="status-progress-bar"></div></div>
          <span id="status-progress-label" class="status-progress-label"></span>
        </div>
      </footer>
    </main>

    <div id="modal-root" class="modal-root" hidden>
      <div class="modal-backdrop" data-modal-close></div>
      <div class="modal-window">
        <header class="panel-head">
          <span id="modal-title">Browse</span>
          <div class="panel-actions">
            <input id="modal-search" class="modal-search" type="search" placeholder="Filter…" hidden />
            <button class="ghost-button" type="button" data-modal-close>Close</button>
          </div>
        </header>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <div id="shortcut-hint" class="shortcut-hint" title="Keyboard shortcuts">
      <button id="shortcut-button" class="ghost-button" type="button">?</button>
    </div>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
